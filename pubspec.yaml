name: bluefarm
description: BlueFarm - Aquaculture Water Quality Monitoring System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.1
  fl_chart: ^0.68.0
  camera: ^0.11.0
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_animate: ^4.3.0
  permission_handler: ^11.1.0
  intl: ^0.20.2
  geolocator: ^11.0.0
  google_sign_in: ^6.2.1
  image_picker: ^1.2.3
  url_launcher: ^6.2.5          # ← required for UPI deep links
  video_player: ^2.11.1
  google_generative_ai: ^0.4.7
  google_mlkit_text_recognition: ^0.16.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/